name: 10 - Viet hoa video tieng Trung (kho public)

# Việc nặng của "Việt hóa video tiếng Trung": kiểm tra video, tách âm thanh/phụ đề, nhận giọng nói, ghi kết quả về kho private.
# Đặt ở .github/workflows/viethoa.yml của kho public (tools/public_runner/sync_public.bat tự chép). Cần secret PRIVATE_REPO_TOKEN;
# Bước dịch dùng chuỗi AI của bot (GROQ_API_KEY / NVIDIA_API_KEY miễn phí trước, rồi GEMINI_API_KEY hoặc AI_PROVIDERS + AI_CONFIG_SECRET).
# Bước dựng lưu video vào R2 nếu dự án dùng kho R2 (secrets R2_*), nếu không thì vào nhánh previews của kho private (PRIVATE_REPO_TOKEN).
# GEMINI_API_KEY cho bước nhận giọng nói chỉ dùng khi viethoa.stt_engine = "auto" trong config.json.
# Log của kho public ai cũng đọc được: chỉ in trạng thái và số liệu, không bao giờ in nội dung phụ đề.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Mã dự án (vh-xxxxxx)"
        required: true
      rev:
        description: "Số lần chạy của dự án (rev)"
        required: false
        default: "0"
      step:
        description: "source = lấy chữ gốc | translate = dịch sang tiếng Việt (dừng lại chờ duyệt) | render = dựng vietsub hoặc giọng đọc từ bản dịch đã duyệt | publish = đăng video đã dựng | check = kiểm tra kết nối kênh đăng"
        required: false
        default: "source"
      force:
        description: "yes = bỏ qua kết quả đã lưu, làm lại từ đầu"
        required: false
        default: "no"
      variant:
        description: "Bước render: sub = chỉ vietsub | voice = giọng đọc tiếng Việt"
        required: false
        default: "sub"
      suffix:
        description: "Bước publish/check: đuôi tên secret của kênh đăng (vd _VH1; để trống = kênh en). Chỉ chữ HOA, số, _"
        required: false
        default: ""
      target:
        description: "Bước check: mã kênh đăng (t-xxxx)"
        required: false
        default: ""

# Một dự án chỉ chạy một lượt một lúc; bấm trùng thì lượt sau xếp hàng chờ (không hủy lượt đang chạy)
concurrency:
  group: viethoa-${{ github.event.inputs.project }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phatnh91/dailybreadwithgod
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiem tra dau vao
        env:
          SUFFIX: ${{ github.event.inputs.suffix }}
          STEP: ${{ github.event.inputs.step }}
        run: |
          [[ "$SUFFIX" =~ ^[A-Z0-9_]{0,12}$ ]] || { echo "::error::Đuôi mã kênh đăng không hợp lệ"; exit 1; }
          case "$STEP" in source|translate|render|publish|check) ;; *) echo "::error::Bước không hợp lệ"; exit 1;; esac
      - name: Giu lai ffmpeg giua cac lan chay
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-v1-${{ runner.os }}
      - name: Giu lai thu vien Python giua cac lan chay
        # Hai bo thu vien: "src" (buoc lay chu: Whisper + OCR, nang) va "light" (dich / dung / dang, nhe) de cac buoc nhe khong phai tai cache lon
        uses: actions/cache@v4
        with:
          path: ~/vh-venv
          key: vh-venv-v1-${{ runner.os }}-py312-${{ github.event.inputs.step == 'source' && 'src' || 'light' }}
      - name: Cai ffmpeg va thu vien
        env:
          STEP: ${{ github.event.inputs.step }}
          VARIANT: ${{ github.event.inputs.variant }}
        run: |
          # Đã có thì dùng lại từ cache (GitHub cấp máy mới mỗi lần chạy nên cài lại từ đầu rất tốn thời gian). Cache hỏng hoặc thiếu thì tự cài như cũ.
          SECONDS=0
          FF="$HOME/ffmpeg-static"
          ff_ok() { [ -x "$FF/ffmpeg" ] && [ -x "$FF/ffprobe" ] && "$FF/ffmpeg" -hide_banner -filters 2>/dev/null | grep -qw ass && "$FF/ffmpeg" -hide_banner -encoders 2>/dev/null | grep -q libx264 && "$FF/ffmpeg" -hide_banner -encoders 2>/dev/null | grep -q libmp3lame; }
          FFSRC=cache
          if ! ff_ok; then
            FFSRC=tai-moi
            rm -rf "$FF"; mkdir -p "$FF"
            if curl -fsSL --retry 3 --max-time 240 -o "$RUNNER_TEMP/ff.tar.xz" "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-linux64-gpl-7.1.tar.xz" \
               && tar -xJf "$RUNNER_TEMP/ff.tar.xz" -C "$FF" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' --strip-components=2; then :; else rm -rf "$FF"; fi
          fi
          if ff_ok; then
            echo "$FF" >> "$GITHUB_PATH"
          else
            FFSRC=apt
            rm -rf "$FF"
            which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          fi
          if [ "$STEP" = "render" ] && ! fc-list 2>/dev/null | grep -qi "noto sans"; then sudo apt-get install -y fonts-noto-core fonts-dejavu-core fontconfig || true; fi
          VENV="$HOME/vh-venv"; PYSRC=cache
          "$VENV/bin/python" -c "import sys" 2>/dev/null || { rm -rf "$VENV"; python -m venv "$VENV"; PYSRC=tao-moi; }
          export PATH="$VENV/bin:$PATH"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          pip install -q requests numpy edge-tts || echo "::warning title=Thu vien::Không cài được một số thư viện cơ bản"
          case "$STEP" in
            source)
              pip install -q faster-whisper || echo "::warning title=Whisper::Không cài được faster-whisper, bước nhận giọng nói sẽ báo lỗi, hãy dùng file SRT/VTT"
              pip install -q pillow rapidocr-onnxruntime || echo "::warning title=OCR::Không cài được RapidOCR, sẽ dùng Tesseract (kém chính xác hơn với chữ Hán)" ;;
          esac
          echo "Cài đặt xong sau ${SECONDS}s (ffmpeg: ${FFSRC}, thư viện Python: ${PYSRC})"

      - name: Cai OCR (chi khi du an doc chu tren hinh)
        if: github.event.inputs.step == 'source'
        env:
          PROJECT: ${{ github.event.inputs.project }}
        run: |
          INFO=$(python3 -c "import json,os;p=json.load(open('viethoa/%s/project.json' % os.environ['PROJECT']));print(p.get('mode',''),p.get('language','zh'))" 2>/dev/null || echo "")
          set -- $INFO
          if [ "$1" = "ocr" ]; then
            case "$2" in zh) PK=chi-sim;; en) PK=;; ja) PK=jpn;; ko) PK=kor;; th) PK=tha;; id) PK=ind;; fr) PK=fra;; de) PK=deu;; es) PK=spa;; pt) PK=por;; it) PK=ita;; ru) PK=rus;; hi) PK=hin;; ar) PK=ara;; *) PK=;; esac
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq tesseract-ocr ${PK:+tesseract-ocr-$PK} libgl1 || echo "::warning title=OCR::Không cài được Tesseract"
            pip install pillow
            if [ "$2" = "zh" ] || [ "$2" = "en" ]; then pip install rapidocr-onnxruntime || echo "::warning title=OCR::Không cài được RapidOCR, sẽ dùng Tesseract (kém chính xác hơn với chữ Hán)"; fi
          fi
      - name: Giu lai model Whisper giua cac lan chay
        if: github.event.inputs.step == 'source'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
      - name: Xu ly (lay chu, dich, dung video)
        if: github.event.inputs.step != 'publish' && github.event.inputs.step != 'check'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TARGET_REPO: phatnh91/dailybreadwithgod
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDERS: ${{ vars.XOAI_AI_PROVIDERS }}
          AI_CONFIG_SECRET: ${{ secrets.AI_CONFIG_SECRET }}
        run: |
          set +e
          python viethoa_build.py "${{ github.event.inputs.step || 'source' }}" --project "${{ github.event.inputs.project }}" --rev "${{ github.event.inputs.rev }}" ${{ github.event.inputs.step == 'render' && format('--variant {0}', github.event.inputs.variant == 'voice' && 'voice' || 'sub') || '' }} ${{ github.event.inputs.force == 'yes' && '--force' || '' }} > "$RUNNER_TEMP/step.log" 2>&1
          rc=$?
          grep -E "::(notice|warning|error)|✅|❌|⚠|Video hợp lệ|Video |Đã lưu xem trước|Chưa lưu|bitrate|Bản đã dựng|Video vietsub|Giọng đọc|Edge TTS|kho R2|Nguồn và cài đặt|Bản dịch đã có|STT |Whisper|Gemini|AI lỗi|AI đang dùng|AI dự phòng|Lô [0-9]|đã cũ|lượt khác|xóa translation" "$RUNNER_TEMP/step.log" | cut -c1-200 | head -40
          if [ $rc -ne 0 ]; then echo "Lỗi (mã $rc), 6 dòng cuối:"; tail -n 6 "$RUNNER_TEMP/step.log" | cut -c1-160; fi
          exit $rc
      - name: Dang video / kiem tra ket noi kenh dang
        if: github.event.inputs.step == 'publish' || github.event.inputs.step == 'check'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TARGET_REPO: phatnh91/dailybreadwithgod
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Mã của kênh đăng lấy theo đuôi tên secret (vd _VH1 -> FB_PAGE_ID_VH1). Kênh en dùng secret không đuôi.
          FB_PAGE_ID: ${{ secrets[format('FB_PAGE_ID{0}', github.event.inputs.suffix)] }}
          FB_PAGE_TOKEN: ${{ secrets[format('FB_PAGE_TOKEN{0}', github.event.inputs.suffix)] }}
          YT_REFRESH_TOKEN: ${{ secrets[format('YT_REFRESH_TOKEN{0}', github.event.inputs.suffix)] }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEP: ${{ github.event.inputs.step }}
          PROJECT: ${{ github.event.inputs.project }}
          REV: ${{ github.event.inputs.rev }}
          TARGET: ${{ github.event.inputs.target }}
          SUFFIX: ${{ github.event.inputs.suffix }}
        run: |
          set +e
          if [ "$STEP" = "check" ]; then python viethoa_build.py check-target --target "$TARGET" --suffix "$SUFFIX" > "$RUNNER_TEMP/step.log" 2>&1
          else python viethoa_build.py publish --project "$PROJECT" --rev "$REV" > "$RUNNER_TEMP/step.log" 2>&1; fi
          rc=$?
          # Log của kho public ai cũng đọc được: chỉ giữ dòng trạng thái, không có nội dung bài đăng và không có mã
          grep -E "✅|❌|⚠|Facebook|YouTube|Instagram|Video hợp lệ|lượt khác|đã cũ" "$RUNNER_TEMP/step.log" | cut -c1-200 | head -30
          if [ $rc -ne 0 ]; then echo "Lỗi (mã $rc), 6 dòng cuối:"; tail -n 6 "$RUNNER_TEMP/step.log" | cut -c1-160; fi
          exit $rc
      - name: Ghi loi neu may chay chet giua chung
        if: (failure() || cancelled()) && github.event.inputs.step != 'check'
        run: python viethoa_build.py mark-failed --project "${{ github.event.inputs.project }}"
