name: 10 - Viet hoa video tieng Trung (kho public)

# Việc nặng của "Việt hóa video tiếng Trung": kiểm tra video, tách âm thanh/phụ đề, nhận giọng nói, ghi kết quả về kho private.
# Đặt ở .github/workflows/viethoa.yml của kho public (tools/public_runner/sync_public.bat tự chép). Cần secret PRIVATE_REPO_TOKEN;
# Bước dịch dùng chuỗi AI của bot (GROQ_API_KEY / NVIDIA_API_KEY miễn phí trước, rồi GEMINI_API_KEY hoặc AI_PROVIDERS + AI_CONFIG_SECRET).
# GEMINI_API_KEY cho bước nhận giọng nói chỉ dùng khi viethoa.stt_engine = "auto" trong config.json.
# Log của kho public ai cũng đọc được: chỉ in trạng thái và số liệu, không bao giờ in nội dung phụ đề.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Mã dự án (vh-xxxxxx)"
        required: true
      rev:
        description: "Số lần chạy của dự án (rev)"
        required: false
        default: "0"
      step:
        description: "source = lấy chữ tiếng Trung | translate = dịch sang tiếng Việt (dừng lại chờ duyệt)"
        required: false
        default: "source"
      force:
        description: "yes = bỏ qua kết quả đã lưu, làm lại từ đầu"
        required: false
        default: "no"

# Một dự án chỉ chạy một lượt một lúc; bấm trùng thì lượt sau xếp hàng chờ (không hủy lượt đang chạy)
concurrency:
  group: viethoa-${{ github.event.inputs.project }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phatnh91/dailybreadwithgod
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cai ffmpeg va thu vien
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install requests
          [ "${{ github.event.inputs.step }}" = "translate" ] || pip install faster-whisper || echo "::warning title=Whisper::Không cài được faster-whisper, bước nhận giọng nói sẽ báo lỗi, hãy dùng file SRT/VTT"
      - name: Giu lai model Whisper giua cac lan chay
        if: github.event.inputs.step != 'translate'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
      - name: Xu ly (lay chu hoac dich)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDERS: ${{ vars.XOAI_AI_PROVIDERS }}
          AI_CONFIG_SECRET: ${{ secrets.AI_CONFIG_SECRET }}
        run: |
          set +e
          python viethoa_build.py "${{ github.event.inputs.step || 'source' }}" --project "${{ github.event.inputs.project }}" --rev "${{ github.event.inputs.rev }}" ${{ github.event.inputs.force == 'yes' && '--force' || '' }} > "$RUNNER_TEMP/step.log" 2>&1
          rc=$?
          grep -E "::(notice|warning|error)|✅|❌|⚠|Video hợp lệ|Nguồn và cài đặt|Bản dịch đã có|STT |Whisper|Gemini|AI lỗi|AI đang dùng|AI dự phòng|Lô [0-9]|đã cũ|lượt khác|xóa translation" "$RUNNER_TEMP/step.log" | cut -c1-200 | head -40
          if [ $rc -ne 0 ]; then echo "Lỗi (mã $rc), 6 dòng cuối:"; tail -n 6 "$RUNNER_TEMP/step.log" | cut -c1-160; fi
          exit $rc
      - name: Ghi loi neu may chay chet giua chung
        if: failure() || cancelled()
        run: python viethoa_build.py mark-failed --project "${{ github.event.inputs.project }}"
