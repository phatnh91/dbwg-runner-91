name: 14 - Ke chuyen + Dang (kho public)

# Dat o .github/workflows/storypost.yml cua kho public (sync_public.bat tu chep). Dung 1 tap series KE CHUYEN roi DANG that len Facebook / Instagram / YouTube.
# Can secret nhu publish.yml cua kho public: PRIVATE_REPO_TOKEN (Contents: Read and write), FB_PAGE_ID_VI, FB_PAGE_TOKEN_VI, YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN_VI, R2_*, TELEGRAM_*, PEXELS_API_KEY, GEMINI_API_KEY, AI_CONFIG_SECRET.
# Chay tay: Actions -> workflow nay -> Run workflow. Mac dinh chi dang cac nen tang ghi o o "only".
# Bao cao tung nen tang (da dang / bi chan vi ly do gi) gui qua Telegram; bai da dang duoc ghi vao channels/<kenh>/posted.csv de khong dang trung.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Trang: vi hoac en"
        required: true
        default: "vi"
      series:
        description: "Ten bo (thu muc trong series/)"
        required: true
        default: "tong-do"
      episode:
        description: "Tap so"
        required: true
        default: "1"
      only:
        description: "Chi dang cac nen tang nay (facebook, instagram, youtube; cach nhau dau phay)"
        required: true
        default: "facebook,instagram,youtube"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: storypost-${{ github.event.inputs.channel }}
      cancel-in-progress: false
    steps:
      - name: Kiem tra dau vao
        env:
          CH: ${{ github.event.inputs.channel }}
          SE: ${{ github.event.inputs.series }}
          EP: ${{ github.event.inputs.episode }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          [[ "$CH" =~ ^(vi|en)$ && "$SE" =~ ^[a-z0-9-]{2,30}$ && "$EP" =~ ^[0-9]{1,3}$ && "$ONLY" =~ ^(facebook|instagram|youtube)(,(facebook|instagram|youtube))*$ ]] || { echo "::error::Dau vao khong hop le"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: phatnh91/dailybreadwithgod
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cai ffmpeg, font va thu vien
        timeout-minutes: 10
        run: |
          # Font da nam trong assets/fonts; may ubuntu-latest co san ffmpeg (khong apt-get: tai font Noto rat lau)
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
          pip install -r requirements.txt numpy
      - name: Dung tap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          AI_CONFIG_SECRET: ${{ secrets.AI_CONFIG_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHANNEL: ${{ github.event.inputs.channel }}
        run: python story_build.py --channel "${{ github.event.inputs.channel }}" --series "${{ github.event.inputs.series }}" --episode "${{ github.event.inputs.episode }}" --no-preview
      - name: Luu video de dang tay neu can
        uses: actions/upload-artifact@v4
        with:
          name: tap-${{ github.event.inputs.series }}-${{ github.event.inputs.episode }}-${{ github.event.inputs.channel }}
          path: |
            out/${{ github.event.inputs.channel }}/reel.mp4
            out/${{ github.event.inputs.channel }}/caption.txt
          retention-days: 3
      - name: Dang bai
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          ONLY_PLATFORMS: ${{ github.event.inputs.only }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FB_PAGE_ID: ${{ secrets[format('FB_PAGE_ID{0}', github.event.inputs.channel == 'vi' && '_VI' || '')] }}
          FB_PAGE_TOKEN: ${{ secrets[format('FB_PAGE_TOKEN{0}', github.event.inputs.channel == 'vi' && '_VI' || '')] }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets[format('YT_REFRESH_TOKEN{0}', github.event.inputs.channel == 'vi' && '_VI' || '')] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        # Log kho public ai cung doc duoc: loc bot, chi giu dong trang thai va loi
        run: |
          set +e
          python publish.py > "$RUNNER_TEMP/pub.log" 2>&1
          rc=$?
          grep -E "✅|❌|⚠|Đã đăng|đã đăng|bỏ qua|Bỏ qua|lỗi|Lỗi|HTTP [0-9]{3}|Facebook|YouTube|Instagram" "$RUNNER_TEMP/pub.log" | cut -c1-200 | head -40
          if [ $rc -ne 0 ]; then echo "Lỗi (mã $rc), 8 dòng cuối:"; tail -n 8 "$RUNNER_TEMP/pub.log" | cut -c1-200; fi
          exit $rc
      - name: Ghi lai nen tang da dang (tranh dang trung)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "daily-bread-bot"
          git config user.email "daily-bread-bot@users.noreply.github.com"
          # 19/10: cung loi nhu storyauto.yml - publish.py con ghi channels/<ch>/thumb_log.csv ngoai pham vi
          # git add nay, lam git pull --rebase ngay duoi bi chan vi "unstaged changes" du da dang xong thật.
          git add -A channels/${{ github.event.inputs.channel }} 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Da dang ke chuyen ${{ github.event.inputs.series }} tap ${{ github.event.inputs.episode }} (${{ github.event.inputs.channel }})"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
