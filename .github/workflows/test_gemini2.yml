name: 24 - Thu Gemini tai khoan 2 (kho public)

# Chay mot lan de xac nhan secret GEMINI_API_KEY_2 hoat dong, khong dung den Gemini chinh/Groq/NVIDIA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phatnh91/dailybreadwithgod
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cai thu vien
        run: pip install -r requirements.txt

      - name: Thu goi Gemini tai khoan 2
        env:
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: python tools/test_gemini2.py
