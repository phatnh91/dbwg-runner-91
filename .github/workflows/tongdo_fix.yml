name: 29 - Them biet danh Tong Do vao mo ta YouTube (kho public)

# Viec mot lan: theo tu khoa YouTube Studio AI tra loi anh Hunter (22/10), viewer tim "Sons of Zebedee"
# (Gia-co, Giang), "Levi" (Ma-thi-o), "Didymus" (Tho-ma) nhieu hon ten rieng. Noi them 1 dong bien danh
# vao CUOI mo ta 4 video da dang (tap 4,5,8,9, trang EN), khong doi gi khac. Dung lai
# bot.youtube.append_description() (da co, tu bo qua neu da noi roi). Xem tools/add_apostle_aliases.py.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phatnh91/dailybreadwithgod
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Noi bien danh vao mo ta
        env:
          CHANNEL: en
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/add_apostle_aliases.py
