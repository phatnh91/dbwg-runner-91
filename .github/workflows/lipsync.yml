# KHO PUBLIC: chạy việc trên máy miễn phí của GitHub, lấy mã từ kho private và ghi kết quả về kho private.
# Đặt file này ở .github/workflows/lipsync.yml của kho public. Cần secret PRIVATE_REPO_TOKEN (Contents: Read and write
# trên kho private) và các secret như file gốc. Sinh tự động bằng tools/public_runner/make_public.py: đừng sửa tay.
name: 7 - Nhep mieng mien phi (thu nghiem Wav2Lip) (kho public)

# Tạo podcast/<id>/clips/talking.mp4 từ một cảnh Flow + podcast/<id>/audio/full.mp3, chạy trên CPU của GitHub,
# rồi gọi workflow 6 ghép thành bản podcast hoàn chỉnh. Wav2Lip chỉ cho phép dùng phi thương mại.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Mã tập podcast (thư mục trong podcast/)"
        required: true
      clip:
        description: "Cảnh làm nền: tên file trong clips/ (vd 01.mp4) hoặc đường dẫn (vd podcast/base/01.mp4). Trống = cảnh đầu tiên"
        required: false
        default: ""
      out:
        description: "Tên file kết quả trong clips/ (mặc định talking.mp4 = dùng để ghép)"
        required: false
        default: "talking.mp4"
      mode:
        type: choice
        options: ["fast", "full"]
        default: "fast"

permissions:
  contents: write
  actions: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  lipsync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phatnh91/dailybreadwithgod
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Cài ffmpeg và thư viện
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.2
          pip install "numpy==1.23.5" "librosa==0.9.2" "numba==0.56.4" "opencv-python-headless==4.7.0.72" scipy tqdm requests
      - name: Tải Wav2Lip và mô hình
        run: |
          git clone --depth 1 https://github.com/Rudrabha/Wav2Lip.git
          mkdir -p Wav2Lip/checkpoints
          ok=""
          for u in \
            https://huggingface.co/Nekochu/Wav2Lip/resolve/main/wav2lip_gan.pth \
            https://huggingface.co/numz/wav2lip_studio/resolve/main/Wav2lip/wav2lip_gan.pth \
            https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth \
            https://huggingface.co/spaces/kevinwang676/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth; do
            if curl -fsSL -o Wav2Lip/checkpoints/wav2lip_gan.pth "$u" && [ "$(stat -c%s Wav2Lip/checkpoints/wav2lip_gan.pth)" -gt 100000000 ]; then ok="$u"; break; fi
          done
          [ -n "$ok" ] || { echo "::error title=Wav2Lip::Không tải được wav2lip_gan.pth từ các nguồn đã thử"; exit 1; }
          echo "::notice title=Wav2Lip::Mô hình từ $ok"
          curl -fsSL -o Wav2Lip/face_detection/detection/sfd/s3fd.pth https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth \
            || { echo "::error title=Wav2Lip::Không tải được s3fd.pth"; exit 1; }
      - name: Nhép miệng
        env:
          W2L_DIR: Wav2Lip
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        # Log của kho public ai cũng đọc được: chỉ giữ dòng trạng thái và lỗi
        run: |
          set +e
          python lipsync.py --id "${{ github.event.inputs.id }}" --clip "${{ github.event.inputs.clip }}" --out "${{ github.event.inputs.out || 'talking.mp4' }}" ${{ github.event.inputs.mode == 'full' && '--full-detect' || '' }} > "$RUNNER_TEMP/step.log" 2>&1
          rc=$?
          grep -E "::(notice|warning|error)|✅|❌|⚠|Đã |đã |Lỗi|lỗi|CẢNH BÁO|HTTP [0-9]{3}|Tổng thời lượng|bỏ qua|Bỏ qua|CONN_RESULT" "$RUNNER_TEMP/step.log" | cut -c1-200 | head -40
          if [ $rc -ne 0 ]; then echo "Lỗi (mã $rc), 8 dòng cuối:"; tail -n 8 "$RUNNER_TEMP/step.log" | cut -c1-200; fi
          exit $rc
      - name: Lưu talking.mp4 và gọi ghép podcast
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "daily-bread-bot"
          git config user.email "daily-bread-bot@users.noreply.github.com"
          OUT="${{ github.event.inputs.out || 'talking.mp4' }}"
          git add "podcast/${{ github.event.inputs.id }}/clips/$OUT"
          git commit -m "Podcast: nhép miệng ${{ github.event.inputs.id }} ($OUT)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i * 5)); done
          if [ "$OUT" = "talking.mp4" ]; then gh workflow run podcast.yml -f action=build -f id="${{ github.event.inputs.id }}"; fi
