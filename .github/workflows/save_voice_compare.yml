name: 32 - Luu file so sanh giong vao kho private (kho public)

# Lay artifact "so-sanh-giong" cua mot luot chay workflow 31 roi day vao nhanh rieng "so-sanh-giong" cua kho private
# (khong dung main, khong dung nhanh bot dang dung). File giong clone cua anh Hunter khong de o kho public.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID luot chay workflow 31"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  save:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Kiem tra dau vao
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: '[[ "$RUN_ID" =~ ^[0-9]{5,15}$ ]] || { echo "run_id sai"; exit 1; }'

      - uses: actions/download-artifact@v4
        with:
          name: so-sanh-giong
          path: so-sanh-giong
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Day vao nhanh so-sanh-giong cua kho private
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          cd so-sanh-giong && ls -la
          git init -q -b so-sanh-giong
          git config user.name "dbwg-bot" && git config user.email "bot@users.noreply.github.com"
          git add . && git commit -qm "File nghe so sanh giong doc luatchoi"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/phatnh91/dailybreadwithgod.git" so-sanh-giong
          echo "Da day vao nhanh so-sanh-giong"
