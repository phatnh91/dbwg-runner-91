name: 13 - Ke chuyen (series ke chuyen, kho public)

# Dung mot tap series KE CHUYEN (vd "Muoi hai tong do"): giong ke + tranh tu lieu + phu de, 3-5 phut, gui ban xem truoc qua Telegram.
# Dat o .github/workflows/story.yml cua kho public (tools/public_runner/sync_public.bat tu chep). Can secret PRIVATE_REPO_TOKEN,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, PEXELS_API_KEY (du phong anh); giong Edge khong can khoa.
# Chay tay: Actions -> "Ke chuyen" -> Run workflow. Video day du tai o muc Artifacts cua lan chay (giu 2 ngay) de dang bang tay.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Trang: vi hoac en"
        required: true
        default: "vi"
      series:
        description: "Ten bo (thu muc trong series/)"
        required: true
        default: "tong-do"
      episode:
        description: "Tap so"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Kiem tra dau vao
        env:
          CH: ${{ github.event.inputs.channel }}
          SE: ${{ github.event.inputs.series }}
          EP: ${{ github.event.inputs.episode }}
        run: |
          [[ "$CH" =~ ^(vi|en)$ && "$SE" =~ ^[a-z0-9-]{2,30}$ && "$EP" =~ ^[0-9]{1,3}$ ]] || { echo "::error::Dau vao khong hop le"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: phatnh91/dailybreadwithgod
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cai ffmpeg, font va thu vien
        timeout-minutes: 10
        run: |
          # Font da nam trong assets/fonts; may ubuntu-latest co san ffmpeg (khong apt-get: tai font Noto rat lau)
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
          pip install -r requirements.txt numpy
      - name: Dung tap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_CONFIG_SECRET: ${{ secrets.AI_CONFIG_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHANNEL: ${{ github.event.inputs.channel }}
        run: python story_build.py --channel "${{ github.event.inputs.channel }}" --series "${{ github.event.inputs.series }}" --episode "${{ github.event.inputs.episode }}"
      - name: Luu video day du de dang tay
        uses: actions/upload-artifact@v4
        with:
          name: tap-${{ github.event.inputs.series }}-${{ github.event.inputs.episode }}-${{ github.event.inputs.channel }}
          path: |
            out/${{ github.event.inputs.channel }}/reel.mp4
            out/${{ github.event.inputs.channel }}/caption.txt
          retention-days: 2
