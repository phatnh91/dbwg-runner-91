name: 16 - AI soan bo ke chuyen moi (dan y / kich ban nhap)

# Dat o .github/workflows/storygen.yml cua kho public (sync_public.bat tu chep).
# Chi tao BAN NHAP trong kho rieng (series/<bo>/outline.json va scripts/epNN_<vi|en>.md). Khong dung video, khong dang bai.
# Moi lan goi AI tinh 1 luot: toi da 30 luot/bo/ngay, 60 luot/ngay (story_gen.py, dem trong series/_gen_usage.json).
# Log kho public ai cung doc duoc: chi in dong trang thai ngan, khong in noi dung kich ban.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "outline (soan dan y tu series/<bo>/request.json) hoac script (soan kich ban 1 tap)"
        required: true
        default: "outline"
      series:
        description: "Ten bo (thu muc trong series/), chi a-z 0-9 va dau gach ngang"
        required: true
      episode:
        description: "So tap (chi dung cho step=script; 0 = moi tap chua co kich ban)"
        required: false
        default: "0"
      lang:
        description: "vi, en hoac both (chi dung cho step=script)"
        required: false
        default: "both"
      force:
        description: "true = soan lai ke ca khi da co kich ban (tap da duyet van khong bi ghi de)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: storygen
      cancel-in-progress: false
    env:
      STEP: ${{ github.event.inputs.step }}
      SE: ${{ github.event.inputs.series }}
      EPN: ${{ github.event.inputs.episode || '0' }}
      LG: ${{ github.event.inputs.lang || 'both' }}
      FORCE: ${{ github.event.inputs.force || 'false' }}
    steps:
      - name: Kiem tra dau vao
        run: |
          [[ "$STEP" =~ ^(outline|script)$ && "$SE" =~ ^[a-z0-9-]{2,30}$ && "$EPN" =~ ^[0-9]{1,3}$ && "$LG" =~ ^(vi|en|both)$ && "$FORCE" =~ ^(true|false)$ ]] || { echo "::error::Dau vao khong hop le"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: phatnh91/dailybreadwithgod
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cai thu vien
        run: pip install -r requirements.txt
      - name: Soan ban nhap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_CONFIG_SECRET: ${{ secrets.AI_CONFIG_SECRET }}
        run: |
          set +e
          ARGS=(--series "$SE")
          if [ "$STEP" = "script" ]; then ARGS+=(--episode "$EPN" --lang "$LG"); [ "$FORCE" = "true" ] && ARGS+=(--force); fi
          python story_gen.py "$STEP" "${ARGS[@]}" > "$RUNNER_TEMP/gen.log" 2>&1
          rc=$?
          grep -E "^(Tập |Đã soạn|Dừng:|Lỗi:|Tên bộ)" "$RUNNER_TEMP/gen.log" | cut -c1-200 | head -20
          exit $rc
      - name: Luu ban nhap vao kho rieng
        if: always() && !cancelled()
        run: |
          git config user.name "daily-bread-bot"
          git config user.email "daily-bread-bot@users.noreply.github.com"
          git add "series/$SE" series/_gen_usage.json
          git diff --cached --quiet && { echo "Khong co thay doi"; exit 0; }
          git commit -q -m "AI soan nhap: $STEP $SE ${EPN}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
